# Camera settings
camera:
  device_id: 0
  width: 640
  height: 480
  fps_target: 30
  frame_skip: 2

# Detection settings
detection:
  model: "yolo11n.pt"
  device: "cpu"
  confidence: 0.35
  iou: 0.4
  max_det: 10

# Tracking settings
tracking:
  max_age: 30
  min_hits: 1
  iou_threshold: 0.25

# OCR settings
ocr:
  languages: ["en"]
  gpu: false
  min_confidence: 0.3

# Scene Captioning settings
captioning:
  model: "Salesforce/blip-image-captioning-base"
  device: "cpu"
  max_length: 30
  min_length: 5

# TTS settings
tts:
  rate: 150
  volume: 0.9

tracker:
  model: yolo11n.pt
  confidence: 0.55        # Raised from 0.5 — reduces false positives
  iou_threshold: 0.45
  max_age: 30
  min_hits: 3             # Object must appear in 3 frames before being tracked
  device: cpu

warnings:
  enabled: true
  global_cooldown: 3.0
  per_track_cooldown: 4.0
  min_confidence: 0.65    # Raised from 0.6 — only warn on high confidence
  min_bbox_ratio: 0.02
  max_bbox_ratio: 0.35
  risk_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck

# Logging
logging:
  level: "INFO"
  show_fps: true
